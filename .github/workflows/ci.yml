name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, unit & e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  docker:
    name: Clean-start smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack from scratch
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Query the API
        run: |
          curl -sf http://localhost:3000/graphql \
            -H 'content-type: application/json' \
            -d '{"query":"{ profile { name skills { name } experience { company } projects { name } } }"}' \
            | tee /dev/stderr | jq -e '.data.profile.name and (.errors | not)'
      - name: Logs
        if: always()
        run: docker compose logs api
