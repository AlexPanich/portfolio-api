# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Creates the Docker web service. PostgreSQL is external (e.g. Neon free
# tier): Render allows a single free database per workspace and expires it
# after 30 days, which does not suit a long-lived business card.
# Migrations and seeding run in docker-entrypoint.sh on every deploy.

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Direct (non-pooled) connection string: `prisma migrate deploy`
      # needs session-level advisory locks that a transaction pooler breaks.
      - key: DATABASE_URL
        sync: false
      # Object storage: Cloudflare R2 (S3-compatible, free tier, no egress
      # fees). The bucket-scoped access keys are secrets set in the dashboard.
      - key: S3_BUCKET
        value: portfolio-media
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://5ed82b7eb9e8db44dfc3cd7295d3ff8c.r2.cloudflarestorage.com
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
