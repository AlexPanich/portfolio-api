# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Creates the Docker web service. PostgreSQL is external (e.g. Neon free
# tier): Render allows a single free database per workspace and expires it
# after 30 days, which does not suit a long-lived business card.
# Migrations and seeding run in docker-entrypoint.sh on every deploy.

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Direct (non-pooled) connection string: `prisma migrate deploy`
      # needs session-level advisory locks that a transaction pooler breaks.
      - key: DATABASE_URL
        sync: false
