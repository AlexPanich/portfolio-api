# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Creates a managed PostgreSQL and a Docker web service wired to it.
# Migrations and seeding run in docker-entrypoint.sh on every deploy.

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
